version: '3.8'

services:
  neo4j_santos:
    image: neo4j:latest
    container_name: neo4j-app-santos
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/admin1234
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - ./neo4j_santos/data:/data
      - ./neo4j_santos/logs:/logs
      - ./neo4j_santos/import:/var/lib/neo4j/import
    restart: unless-stopped

  neo4j_russell:
    image: neo4j:latest
    container_name: neo4j-app-russell
